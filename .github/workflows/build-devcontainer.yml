---
name: Build and push devcontainer base image

on:
  push:
    branches: [main]
    paths:
      - devcontainer/**
  # apt packages (Ubuntu updates, gh, gcloud) are not pinned and only refresh when their
  # layers rebuild, so once a month rebuild everything without cache.
  schedule:
    - cron: "0 10 1 * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/yfhyou/homelab-base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract Ubuntu version from Dockerfile
        id: ubuntu_ver
        run: |
          echo "version=$(grep '^FROM ubuntu:' devcontainer/Dockerfile | cut -d: -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: devcontainer
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ubuntu_ver.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
