---
name: Lint (reusable)

on:
  workflow_call:
    inputs:
      shellcheck:
        description: Run shellcheck on shell scripts
        type: boolean
        default: false
      ansible-lint:
        description: Run ansible-lint
        type: boolean
        default: false
      hadolint:
        description: Run hadolint on Dockerfiles
        type: boolean
        default: false
      ruff:
        description: Run ruff check on Python, using the caller's own ruff config
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch shared linter configs
        uses: actions/checkout@v7
        with:
          repository: yfhyou/.github
          path: .shared
          sparse-checkout: linters/

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: yamllint
        run: |
          pip install --quiet yamllint
          CONFIG=".shared/linters/.yamllint"
          [ -f .yamllint ] && CONFIG=".yamllint"
          yamllint -c "$CONFIG" .

      - name: actionlint
        uses: rhysd/actionlint@v1.7.12

      - name: shellcheck
        if: inputs.shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: "*.sh"
          ignore_paths: .shared

      # Do NOT install ansible-core here. The ansible-lint action installs it via
      # `uv tool install --with-executables-from ansible-core`, and uv refuses to
      # overwrite executables that already exist on PATH — the job dies with
      # "Executables already exist: ansible, ansible-config, ...". Hand the
      # requirements file to the action instead; it runs `ansible-galaxy install`
      # itself, after its own install, and picks up roles as well as collections.
      - name: Detect Galaxy requirements
        id: galaxy
        if: inputs.ansible-lint
        run: |
          if [ -f ansible/requirements.yml ]; then
            echo "requirements=ansible/requirements.yml" >> "$GITHUB_OUTPUT"
          else
            echo "requirements=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create dummy vault password file
        if: inputs.ansible-lint
        run: |
          if [ -f ansible.cfg ]; then
            vault_pass=$(awk -F'=' '/^vault_password_file/{gsub(/ /,"",$2); print $2}' ansible.cfg)
            if [ -n "$vault_pass" ] && [ ! -f "$vault_pass" ]; then
              mkdir -p "$(dirname "$vault_pass")"
              echo "ci-dummy" > "$vault_pass"
            fi
          fi

      - name: ansible-lint
        if: inputs.ansible-lint
        uses: ansible/ansible-lint@v26.9.0
        with:
          requirements_file: ${{ steps.galaxy.outputs.requirements }}

      - name: ruff
        if: inputs.ruff
        run: |
          pip install --quiet ruff
          ruff check --output-format=github .

      - name: hadolint
        if: inputs.hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
